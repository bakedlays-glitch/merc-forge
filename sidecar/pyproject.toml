[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mercwizard-core"
version = "1.0.0-beta.4"
description = "Player-facing mercenary toolkit for Jagged Alliance 2 v1.13"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "bakedlays-glitch" }]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }

[tool.setuptools.packages.find]
include = ["mercwizard_core*", "routes*"]

[tool.setuptools.package-data]
mercwizard_core = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:PIL.*",
]
