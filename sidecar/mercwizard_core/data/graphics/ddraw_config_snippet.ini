; ─────────────────────────────────────────────────────────────────────────────
; cnc-ddraw config snippet for JA2 1.13 visual setup
; Source: https://thewasteland.co/ja2_graphics_setup.html
;
; Merge these keys into the [ddraw] section of your existing ddraw.ini.
; Don't replace your whole ddraw.ini — it ships with per-game compatibility
; presets that you want to keep.
; ─────────────────────────────────────────────────────────────────────────────

[ddraw]
fullscreen=true
windowed=true
maintas=false
inject_resolution=1280x720
renderer=opengl
shader=Shaders\xbrz\xbrz-freescale-multipass.glsl
nonexclusive=true
noactivateapp=true
