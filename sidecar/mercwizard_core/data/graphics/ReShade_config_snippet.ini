; ─────────────────────────────────────────────────────────────────────────────
; ReShade.ini config snippet for JA2 1.13 visual setup
; Source: https://thewasteland.co/ja2_graphics_setup.html
;
; Merge these keys into the [GENERAL], [OVERLAY], and [INPUT] sections of
; your existing ReShade.ini (created by the ReShade installer).
; ─────────────────────────────────────────────────────────────────────────────

[GENERAL]
CurrentPresetPath=.\ja2_remastered.ini
PresetPath=.\ja2_remastered.ini

[OVERLAY]
AutoSavePreset=0

[INPUT]
KeyReload=35,0,0,0
